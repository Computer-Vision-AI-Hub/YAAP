<!doctype html>
<html><head><meta charset="utf-8"><title>autolabel</title></head>
<body><script src="harness.js"></script>
<script>
// Auto-label page: "Find all by concept" without classes (Generic mode), and the
// path from outlined objects to labeling them (Add classes → Label them).
test(async t => {
  const PROJECT = { id: 1, name: "P", task_type: "detect", image_count: 2, annotated_count: 0, predicted_count: 0,
    classes: [] };
  const IMAGES = [1, 2].map(id => ({ id, filename: `i${id}.png`, width: 100, height: 100, status: "unannotated",
    annotation_count: 0, proposal_count: id === 1 ? 3 : 0, split: "" }));
  const posts = [], autolabels = [];
  await t.boot({ routes: [
    ["GET", /\/api\/projects$/, () => []],
    ["GET", /\/api\/projects\/1$/, () => PROJECT],
    ["GET", /\/api\/models/, () => ({ weights: [], pretrained: ["yolo11n.pt"], rtdetr: [], rfdetr_available: false, rfdetr: [] })],
    ["GET", /\/bootstrap$/, () => ({ task: "detect", models: ["yolo11n.pt"], default_model: "yolo11n.pt", labeled: 0,
      background: 0, unannotated: 2, unreviewed: 0, min_labeled: 5, recommended: 10, auto_epochs: 150, next_round: 1,
      new_since_last: null, last: null })],
    ["GET", /\/active-learning$/, () => ({ scored: 0, model_name: "", scored_at: null })],
    ["GET", /\/images$/, () => IMAGES.map(x => ({ ...x }))],
    ["GET", /\/images\/\d+\/annotations$/, () => []],
    ["GET", /\/images\/\d+\/proposals$/, () => []],
    ["POST", /\/sam\/find-all$/, (url, body) => { posts.push(body); return { id: 9, status: "running", total: 2,
      processed: 0, images_labeled: 0, annotations_added: 0, skipped: [], log: "", error: "" }; }],
    ["GET", /\/autolabel\/9$/, () => ({ id: 9, status: "done", total: 2, processed: 2, images_labeled: 1,
      annotations_added: 3, skipped: [], log: "", error: "" })],
    ["POST", /\/autolabel$/, (url, body) => { autolabels.push(body); return { id: 10, status: "running", total: 1,
      processed: 0, images_labeled: 0, annotations_added: 0, skipped: [], log: "", error: "" }; }],
    ["GET", /\/autolabel\/10$/, () => ({ id: 10, status: "done", total: 1, processed: 1, images_labeled: 0,
      annotations_added: 0, skipped: [], log: "", error: "" })],
    ["GET", /\/autolabel\/10\/preview$/, () => ({ job: {}, images: [] })],
  ] });

  await t.go("#/p/1/autolabel", 300);
  const go = document.querySelector("#faGo");
  t.check("no classes: Find all opens in Generic mode", !document.querySelector("#faGeneric").hidden &&
    document.querySelector("#faByClass").hidden);
  t.check("no classes: Generic can run", !go.disabled && document.querySelector("#faNoClass").hidden);
  document.querySelector('#faMode [data-mode="classes"]').click();
  t.check("By class without classes is blocked, with a hint", go.disabled && !document.querySelector("#faNoClass").hidden);
  document.querySelector('#faMode [data-mode="generic"]').click();
  t.check("back to Generic re-enables it", !go.disabled);

  go.click(); await t.sleep(400);
  t.check("Generic sends mode=generic", posts[0]?.mode === "generic" && posts[0].phrases.length > 0, posts[0]);
  const next = document.querySelector("#goLabel");
  t.check("after the run, no classes → 'Add classes →'", next?.textContent.includes("Add classes"), next?.textContent);
  next.click(); await t.sleep(250);
  t.check("…which opens Classes", location.hash === "#/p/1/classes", location.hash);
  t.check("Classes page: no 'Label them' while there are no classes", document.querySelector("#clsProposals").hidden);

  PROJECT.classes = [{ id: 1, name: "cat", color: "#f00", order_idx: 0 }];
  await t.go("#/p/1/review", 50); await t.go("#/p/1/classes", 300);
  t.check("with a class, Classes offers 'Label them →'", !document.querySelector("#clsProposals").hidden &&
    document.querySelector("#clsProposals").textContent.includes("1 image"));
  document.querySelector("#clsLabelFound").click(); await t.sleep(300);
  t.check("'Label them →' opens the editor on the outlined images", location.hash === "#/p/1/annotate" &&
    S.images.every(im => im.proposal_count > 0), S.images.map(i => i.id));

  await t.go("#/p/1/autolabel", 300);
  t.check("with classes, Find all opens By class", !document.querySelector("#faByClass").hidden &&
    !document.querySelector("#faGo").disabled);

  // ── Run a model on the rejected images only, replacing the boxes that were rejected
  IMAGES[1].status = "needs_reannotation"; IMAGES[1].annotation_count = 2;
  const scope = document.querySelector("#alScope");
  scope.value = "rejected"; scope.dispatchEvent(new Event("change"));
  t.check("choosing Rejected images ticks Replace existing", document.querySelector("#alReplace").checked);
  document.querySelector("#alGo").click(); await t.sleep(400);
  const sent = autolabels[0];
  t.check("…and labels only the rejected images", JSON.stringify(sent?.image_ids) === "[2]" &&
    sent.replace_existing === true, sent);
  t.check("…with the duplicate overlap setting", sent?.max_overlap === 0.7, sent);
});
</script></body></html>
