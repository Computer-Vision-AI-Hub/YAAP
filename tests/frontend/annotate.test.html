<!doctype html>
<meta charset="utf-8">
<title>annotate</title>
<script src="harness.js"></script>
<script>
// The Annotate view: listener cleanup, autosave target, class picker, exit flow.
test(async t => {
  const PROJECT = { id: 1, name: "P", task_type: "detect", image_count: 3, annotated_count: 0,
    classes: [{ id: 1, name: "cat", color: "#f00" }, { id: 2, name: "dog", color: "#0f0" }] };
  // server order differs from the order a QC-scoped annotate list may use
  const IMAGES = [3, 1, 2].map(id => ({ id, filename: `i${id}.png`, width: 100, height: 100,
    status: "unannotated", annotation_count: 0, split: "" }));
  const puts = [];
  await t.boot({ routes: [
    ["GET", /\/api\/projects$/, () => []],
    ["GET", /\/api\/projects\/1$/, () => PROJECT],
    ["GET", /\/images$/, () => IMAGES.map(x => ({ ...x }))],
    ["GET", /\/images\/\d+\/annotations$/, () => []],
    ["PUT", /\/images\/(\d+)\/annotations$/, url => { puts.push(+url.match(/images\/(\d+)\//)[1]); return { ok: true }; }],
    ["PATCH", /\/images\/\d+$/, (url, body) => body],
  ] });

  const at = (ed, ix, iy) => {
    const r = ed.cv.getBoundingClientRect(), [sx, sy] = ed.toScr(ix, iy);
    return { clientX: r.left + sx, clientY: r.top + sy, button: 0 };
  };
  async function drawBox(ed) {
    ed.setTool("bbox");
    ed._down(at(ed, 10, 10)); ed._move(at(ed, 60, 60)); ed._up();
    await t.sleep(20);
  }
  let keyCalls = 0;
  const realKey = Editor.prototype._key;
  Editor.prototype._key = function (e) { keyCalls++; return realKey.call(this, e); };
  const press = key => window.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true }));

  // ── listeners don't pile up across visits, and are gone after leaving
  for (const h of ["#/p/1/annotate", "#/p/1/classes", "#/p/1/annotate", "#/p/1/classes", "#/p/1/annotate"]) await t.go(h);
  keyCalls = 0; press("v");
  t.check("one editor key handler after three Annotate visits", keyCalls === 1, keyCalls);
  await t.go("#/p/1/classes");
  keyCalls = 0; press("v");
  t.check("no editor key handler after leaving Annotate", keyCalls === 0, keyCalls);
  t.check("S.editor cleared on leave", S.editor === null);

  // ── arrow keys do nothing outside Annotate
  puts.length = 0;
  press("ArrowRight"); press("ArrowLeft"); await t.sleep(50);
  t.check("arrow keys inert outside Annotate", window.onkeydown === null && !document.querySelector(".toast.err"));

  // ── toolbar highlight matches the starting tool (segment starts on polygon)
  const active = () => [...document.querySelectorAll(".tool-btn.active")].map(b => b.dataset.tool).join(",");
  await t.go("#/p/1/annotate");
  t.check("detect starts on bbox, bbox highlighted", S.editor.tool === "bbox" && active() === "bbox", active());
  PROJECT.task_type = "segment";
  await t.go("#/p/1/classes"); await t.go("#/p/1/annotate");
  t.check("segment starts on polygon, polygon highlighted", S.editor.tool === "polygon" && active() === "polygon",
    { tool: S.editor.tool, active: active() });
  PROJECT.task_type = "detect";
  await t.go("#/p/1/classes");

  // ── drawn box asks for its class, then becomes an annotation
  await t.go("#/p/1/annotate");
  const ed = S.editor;
  await drawBox(ed);
  t.check("drawn box waits for a class", ed.anns.length === 0 && ed.pendingShape?.kind === "bbox");
  let pendingDraws = 0;
  const realPending = ed._drawPendingShape;
  ed._drawPendingShape = function () { pendingDraws++; return realPending.call(this); };
  ed.draw();
  t.check("box stays visible while picking its class", pendingDraws === 1, pendingDraws);
  const chips = [...document.querySelectorAll("#samLabelPick .sam-label-chip")];
  t.check("class picker shows every class", chips.map(c => c.textContent.trim()).join(",") === "cat,dog");
  chips[1].click(); await t.sleep(20);
  t.check("picked class lands on the annotation", ed.anns.length === 1 && ed.anns[0].class_id === 2);
  t.check("picker hides after picking", document.querySelector("#samLabelPick").hidden);
  pendingDraws = 0; ed.draw();
  t.check("no pending outline once the class is picked", pendingDraws === 0, pendingDraws);

  // ── a pending autosave still writes to the image that was edited, even if
  //    S.images/S.curImage change before the 700ms debounce fires
  const editedId = S.images[S.curImage].id;
  puts.length = 0;
  await t.go("#/p/1/classes", 20);
  S.images = IMAGES.map(x => ({ ...x })); S.curImage = 2;   // points at a different image now
  await t.sleep(900);
  t.check("pending autosave targets the edited image", puts.length === 1 && puts[0] === editedId, { puts, editedId });
  t.check("late autosave raises no error toast", !document.querySelector(".toast.err"));

  // ── Exit and running past the last image both land on the project Home view
  await t.go("#/p/1/annotate");
  document.querySelector("#edExit").click(); await t.sleep(100);
  t.check("Exit lands on project Home", location.hash === "#/p/1/review", location.hash);
  await t.go("#/p/1/annotate");
  S.curImage = S.images.length - 1;
  await route(); await t.sleep(150);
  document.querySelector("#nextImg").click(); await t.sleep(100);
  t.check("Next on the last image exits to project Home", location.hash === "#/p/1/review", location.hash);

  // ── "Most uncertain first": hidden until images are ranked, then walks the ranking
  await t.go("#/p/1/classes");
  t.check("uncertainty toggle hidden without a ranking", (await (async () => {
    await t.go("#/p/1/annotate"); return document.querySelector("#edUncWrap").hidden; })()));
  IMAGES.forEach(im => { im.uncertainty = { 3: 0.2, 1: 0.9, 2: 0.5 }[im.id]; });
  try { localStorage.removeItem("yaap.uncertainFirst"); } catch (_) {}
  await t.go("#/p/1/classes"); await t.go("#/p/1/annotate");
  t.check("uncertainty toggle shown once images are ranked", !document.querySelector("#edUncWrap").hidden);
  const unc = document.querySelector("#edUnc");
  unc.checked = true; unc.dispatchEvent(new Event("change")); await t.sleep(200);
  t.check("ticking it opens the most uncertain image", S.images[S.curImage]?.id === 1, S.images.map(i => i.id));
  t.check("…and keeps the ranking order", S.images.map(i => i.id).join() === "1,2,3", S.images.map(i => i.id));
  try { localStorage.removeItem("yaap.uncertainFirst"); } catch (_) {}

  // ── Undo / redo (button and Ctrl+Z / Ctrl+Shift+Z / Ctrl+Y)
  await t.go("#/p/1/classes"); await t.go("#/p/1/annotate");
  const e2 = S.editor, undoBtn = document.querySelector("#edUndo"), redoBtn = document.querySelector("#edRedo");
  const ctrl = (key, shift = false) => document.body.dispatchEvent(new KeyboardEvent("keydown",
    { key, ctrlKey: true, shiftKey: shift, bubbles: true }));
  const big = document.createElement("canvas"); big.width = big.height = 100;   // room to drag (the mock image is 1 px)
  e2.load(big, [], S.images[S.curImage].id);
  const boxes = () => e2.anns.map(a => `${a.class_id}@${Math.round(a.data.x)}`).join(",");
  t.check("undo starts disabled", undoBtn.disabled && redoBtn.disabled);
  await drawBox(e2);
  document.querySelector("#samLabelPick .sam-label-chip").click(); await t.sleep(20);
  t.check("a new box can be undone", e2.anns.length === 1 && !undoBtn.disabled);
  undoBtn.click();
  t.check("Undo removes the box", e2.anns.length === 0 && !redoBtn.disabled,
    { boxes: boxes(), h: e2.history, f: e2.future.length, poly: e2.poly, same: e2 === S.editor });
  redoBtn.click();
  t.check("Redo brings it back", e2.anns.length === 1, boxes());
  e2.setTool("select");
  e2._down(at(e2, 30, 30)); e2._up();                     // a plain click: selects, changes nothing
  t.check("a click that changes nothing adds no undo step", e2.history.length === 1, e2.history.length);
  e2._down(at(e2, 30, 30)); e2._move(at(e2, 50, 50)); e2._move(at(e2, 70, 70)); e2._up();
  const moved = e2.anns[0].data.x;
  t.check("a drag is one undo step", e2.history.length === 2 && moved > 40, { h: e2.history.length, moved });
  ctrl("z");
  t.check("Ctrl+Z undoes the whole drag", Math.round(e2.anns[0].data.x) === 10, boxes());
  ctrl("z", true);
  t.check("Ctrl+Shift+Z redoes it", e2.anns[0].data.x === moved, boxes());
  e2.select(0);
  document.body.dispatchEvent(new KeyboardEvent("keydown", { key: "Delete", bubbles: true }));
  t.check("Delete removes the box", e2.anns.length === 0);
  ctrl("z");
  t.check("…and Ctrl+Z restores it", e2.anns.length === 1, boxes());
  ctrl("y");
  t.check("Ctrl+Y redoes the delete", e2.anns.length === 0, boxes());
  ctrl("z");
  e2.setTool("polygon");
  e2._down(at(e2, 10, 80)); e2._up(); e2._down(at(e2, 40, 80)); e2._up();
  ctrl("z");
  t.check("while drawing a polygon, Ctrl+Z takes back the last point", e2.poly?.length === 1 && e2.anns.length === 1,
    { poly: e2.poly?.length, anns: e2.anns.length });
  ctrl("z"); e2.setTool("bbox");
  await t.sleep(900);                                      // let the autosave of the restored box run
  t.check("undo is saved like any other change", puts.length > 0);
  const firstId = S.images[S.curImage].id, steps = e2.history.length;
  document.querySelector("#nextImg").click(); await t.sleep(200);
  t.check("another image has its own history", S.editor.history.length === 0, S.editor.history.length);
  document.querySelector("#prevImg").click(); await t.sleep(200);
  t.check("…and coming back keeps this one's",
    S.images[S.curImage].id === firstId && S.editor.history.length === steps, S.editor.history.length);
});
</script>
